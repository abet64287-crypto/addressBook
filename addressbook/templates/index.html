<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Address Book</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script><script src="/static/excel.js" defer></script></head>
<body><aside class="sidebar"><a class="brand" href="/">Address Book</a><nav aria-label="Contacts"><button class="nav active" id="all">All contacts <span id="all-count">0</span></button><button class="nav" id="favorites">Favorites <span id="fav-count">0</span></button></nav></aside>
<main><header><h1 id="page-title">All contacts</h1><button class="primary" id="add">+ Add contact</button></header>
<section class="toolbar" aria-label="Search and data tools"><input id="search" type="search" placeholder="Search contacts" aria-label="Search contacts"><select id="group-filter" aria-label="Filter by group"><option value="">All groups</option></select><div class="actions"><a class="button" href="/api/template">Template</a><button id="import">Import Excel</button><a class="button" href="/api/export">Export Excel</a></div><input id="file" type="file" accept=".xlsx" hidden></section>
<div class="workspace"><section class="list-panel"><div class="list-heading"><span>Contacts <b id="result-count">0</b></span><small>Sorted by name</small></div><div id="contacts" aria-live="polite"></div></section><section class="detail" id="detail" aria-label="Contact details"></section></div></main>
<dialog id="editor"><form id="contact-form"><div class="modal-heading"><h2 id="editor-title">Add contact</h2><button type="button" class="icon" id="close" aria-label="Close editor">×</button></div><div class="fields"><label>Name *<input name="name" required maxlength="100" autocomplete="name"></label><label>Company<input name="company" maxlength="200"></label><label>Group<input name="group" maxlength="100" placeholder="e.g. Work"></label><label class="check"><input name="favorite" type="checkbox"> Favorite</label></div><div class="methods-heading"><h3>Contact methods</h3><button id="add-method" type="button">+ Add method</button></div><div id="methods"></div><label class="notes-label">Notes<textarea name="notes" rows="3" maxlength="2000"></textarea></label><p id="form-error" role="alert"></p><div class="modal-footer"><button id="cancel" type="button">Cancel</button><button class="primary" id="save" type="submit">Save contact</button></div></form></dialog>
<div id="toast" role="status" hidden></div></body></html>
